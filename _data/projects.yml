- acronym: "RED"
  title: "Resilient Databases (PDTC/EIAEIA/109044/2008)"
  role: Researcher
  date_start: 2010
  date_end: 2012
  reference: PDTC/EIA-EIA/109044/2008
  website: http://red.lsd.di.uminho.pt/
  description: "The ReD approach is to combine the replication protocol of databases with a specialized copy-on-write volume management system, that holds transient logically independent partial copies, thus masking internal server non-determinism and isolating multiple logical replicas for resilience. My work was focused on database replication, shared storage cluster and storage virtualization. More specifically, the shared-storage cluster approach using mySQL was ported to a virtualized environment that uses XEN."